name: Publish to CurseForge
run-name: CurseForge ${{ github.event.release.tag_name || inputs.tag }} (${{ inputs.mode || 'publish' }})

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or explicitly publish the existing release installer
        type: choice
        required: true
        default: validate
        options:
          - validate
          - publish
      tag:
        description: Existing stable GitHub Release tag (vX.Y.Z)
        type: string
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'TomXingCan/CarGOUI' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read trusted publisher scripts from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false
      - name: Validate or publish the unchanged GitHub Release installer
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/curseforge_publish.py
