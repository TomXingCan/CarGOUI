name: Test CurseForge publisher

on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/publish-curseforge.yml
      - .github/workflows/test-curseforge-publisher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read publisher tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false
      - name: Test validation and upload safety without credentials or network
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
